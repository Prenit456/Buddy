[platformio]
default_envs = buddy-direct
data_dir = data

[env:buddy-direct]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_src_filter = +<main.cpp> +<AudioService.cpp> +<BuddyCamera.cpp> +<DisplayUI.cpp> +<HubSync.cpp> +<SettingsStore.cpp> +<VoiceGateway.cpp>
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^6.21.5
  tzapu/WiFiManager@^2.0.17
  bodmer/TJpg_Decoder@1.1.0
build_flags =
  -std=gnu++17
  -D BOARD_HAS_PSRAM=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BUDDY_ENABLE_NETWORK_VOICE=1
  -D BUDDY_ENABLE_CAMERA=1
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=39
  -D TFT_MISO=-1
  -D TFT_SCLK=38
  -D TFT_CS=41
  -D TFT_DC=40
  -D TFT_RST=42
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=16000000
  -D USE_HSPI_PORT=1
extra_scripts = pre:../scripts/copy_web.py
