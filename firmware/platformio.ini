; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = buddy-s3-camera
data_dir = data

[env]
platform = espressif32@6.10.0
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<stt_test.cpp> -<speaker_test.cpp>
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^6.21.5
	tzapu/WiFiManager@^2.0.17
build_flags = 
	-std=gnu++17
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MOSI=39
	-D TFT_MISO=-1
	-D TFT_SCLK=38
	-D TFT_CS=41
	-D TFT_DC=40
	-D TFT_RST=42
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=16000000
	-D USE_HSPI_PORT=1
extra_scripts = pre:../scripts/copy_web.py

[env:buddy-s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
upload_speed = 115200
build_flags = 
	${env.build_flags}
	-D BOARD_HAS_PSRAM=1

[env:buddy-s3-sam]
extends = env:buddy-s3
lib_deps = 
	${env.lib_deps}
	https://github.com/earlephilhower/ESP8266Audio.git#1.9.7
	https://github.com/earlephilhower/ESP8266SAM.git#1.1.0
build_flags = 
	${env:buddy-s3.build_flags}
	-D BUDDY_ENABLE_SAM=1

[env:buddy-s3-voice]
extends = env:buddy-s3
lib_deps = 
	${env.lib_deps}
	bodmer/TJpg_Decoder@1.1.0
build_flags = 
	${env:buddy-s3.build_flags}
	-D BUDDY_ENABLE_NETWORK_VOICE=1

[env:buddy-s3-camera]
extends = env:buddy-s3-voice
build_flags =
  ${env:buddy-s3-voice.build_flags}
  -D BUDDY_ENABLE_CAMERA=1

; One-time microphone -> Care Hub -> ElevenLabs -> TFT transcription test.
; This environment builds only stt_test.cpp and leaves the main firmware source
; unchanged. Upload buddy-s3-camera again after completing the test.
[env:buddy-s3-stt-test]
extends = env:buddy-s3
build_src_filter = -<*> +<stt_test.cpp>

; Offline MAX98357A test: continuously plays two tones on GPIO 2.
[env:buddy-s3-speaker-test]
extends = env:buddy-s3
build_src_filter = -<*> +<speaker_test.cpp>
