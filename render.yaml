# Free-tier prototype backend. Durable account/device state is in Supabase.
# Free instances sleep and are not suitable for dependable care or emergencies.
# This does not deploy automatically or include API keys. See docs/CLOUD_DEPLOYMENT.md.
services:
  - type: web
    name: buddy-care
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: BUDDY_HOST
        value: 0.0.0.0
      - key: BUDDY_STORAGE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEYS
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEYS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
